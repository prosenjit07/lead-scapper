# Normalized industry taxonomy.
#   keywords:     words in a search keyword or business category that map to this industry
#   osm_tags:     OpenStreetMap tags queried via Overpass ("key=value", "key" for any value)
#   places_types: Google Places (New) place types
# Override or extend with `industries_file:` in config.yaml (same format; entries are merged by name).
industries:
