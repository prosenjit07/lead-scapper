# leadgen configuration. Secrets (API keys, sheet id) go in .env, not here.

# Identify your crawler honestly: a name, version, and a page/email where site owners can reach you.
# Sites can then allow/deny you specifically in robots.txt.
user_agent: "TechnodexLeadBot/1.0 (+https://technodex.vercel.app/; technodexsolutionsltd@gmail.com)"

store: postgres          # sheets | sqlite | postgres  (postgres uses DATABASE_URL from .env: Neon, us-east-2)
                         # Copies as of the 2026-11-22 move to Neon: the local PostgreSQL database `leadgen`,
                         # data/leads.db (SQLite) and data/backup/. Leads saved after that exist only on Neon.
sqlite_path: data/leads.db
state_path: data/state.db
log_dir: logs
log_level: INFO
timezone: UTC            # used for schedules
merge_duplicates: true   # fill BLANK fields of existing leads with newly found data (never status/notes/owner)
# industries_file: config/industries.yaml   # optional: extend/override the built-in industry taxonomy

crawl:
  max_pages_per_site: 6      # homepage + contact/about/impressum/team pages
  per_domain_delay_s: 2      # minimum gap between requests to one host (robots.txt crawl-delay wins if larger)
  concurrency: 10            # sites crawled in parallel (always 1 request at a time per site)
  timeout_s: 15
  retries: 3
  recrawl_after_days: 30     # don't re-crawl a domain within this window
  render_js: false           # true needs: uv sync --extra browser && uv run playwright install chromium

compliance:
  personal_data: allow       # allow | role_only  (role_only keeps only info@/sales@-style addresses; no names)
  retention_days: 365        # `leads purge` deletes un-engaged leads older than this
  lawful_basis: legitimate_interest
  require_email: false       # true = drop businesses where no email was found

osm:
  # overpass-api.de returns HTTP 406 for this machine; private.coffee is a public instance listed on
  # https://wiki.openstreetmap.org/wiki/Overpass_API ("no rate limit"; notify them before large-scale use)
  overpass_url: https://overpass.private.coffee/api/interpreter
  nominatim_url: https://nominatim.openstreetmap.org/search

google_places:
  # Google's terms restrict storing Places content (place IDs are exempt). With false, Places only
  # discovers businesses; stored details come from each business's own website. Review the
  # Google Maps Platform terms before setting this to true.
  store_place_details: false
  language_code: en

searches:
  - name: dental-uk
    keywords: ["dentist"]
    locations: ["Bristol, UK", "Leeds, UK"]
    sources: [osm, google_places]
    industry: "Healthcare / Dental"     # optional: force the industry label
    # osm_tags: ["amenity=dentist"]     # optional: otherwise derived from the industry taxonomy
    max_results: 100                    # per keyword x location x source
    tags: [q1-campaign]

  # Developed ("first-world") countries. Cities, not whole countries: max_results applies per location,
  # and country-wide queries are slow on the public Overpass server.
  # One keyword is enough for OSM: "web design" maps to the same OSM tags as "marketing agency"
  # (office=advertising_agency, office=marketing), so it would only repeat each query.
  - name: agencies-developed
    keywords: ["marketing agency"]
    locations:
      # North America
      - "New York City, USA"
      - "Los Angeles, USA"
      - "Chicago, USA"
      - "San Francisco, USA"
      - "Toronto, Canada"
      - "Vancouver, Canada"
      # UK & Ireland
      - "London, UK"
      - "Manchester, UK"
      - "Dublin, Ireland"
      # Australia, New Zealand, Singapore
      - "Sydney, Australia"
      - "Melbourne, Australia"
      - "Auckland, New Zealand"
      - "Singapore"
      # Western & Northern Europe
      - "Berlin, Germany"
      - "Munich, Germany"
      - "Paris, France"
      - "Amsterdam, Netherlands"
      - "Zurich, Switzerland"
      - "Stockholm, Sweden"
      - "Copenhagen, Denmark"
      - "Oslo, Norway"
    sources: [osm]
    industry: "Marketing & Advertising"
    max_results: 50                    # per city: up to ~1,000 agencies per full run
    tags: [developed-markets]

  # ---------------------------------------------------------------------------------------------
  # Industry searches in English-speaking developed markets: small businesses that usually need a
  # website, booking system or software. They all share the 12-city list below: `&english_markets`
  # names it once, and `*english_markets` reuses it (edit the list here and every search follows).
  # One keyword per search is enough: each maps to several OSM categories (shown on the right).
  # A full run of one search: up to 12 × 50 = 600 businesses, roughly 20–40 minutes of polite crawling.
  - name: dentists-developed
    keywords: ["dentist"]                 # amenity/healthcare=dentist
    locations: &english_markets
      - "New York City, USA"
      - "Los Angeles, USA"
      - "Chicago, USA"
      - "San Francisco, USA"
      - "Toronto, Canada"
      - "Vancouver, Canada"
      - "London, UK"
      - "Manchester, UK"
      - "Dublin, Ireland"
      - "Sydney, Australia"
      - "Melbourne, Australia"
      - "Auckland, New Zealand"
    sources: [osm]
    industry: "Healthcare / Dental"
    max_results: 50
    tags: [developed-markets]

  - name: clinics-developed
    keywords: ["clinic"]                  # doctors, clinics
    locations: *english_markets
    sources: [osm]
    industry: "Healthcare / Medical Practice"
    max_results: 50
    tags: [developed-markets]

  - name: law-firms-developed
    keywords: ["lawyer"]                  # office=lawyer, office=notary
    locations: *english_markets
    sources: [osm]
    industry: "Legal Services"
    max_results: 50
    tags: [developed-markets]

  - name: accountants-developed
    keywords: ["accountant"]              # office=accountant, office=tax_advisor
    locations: *english_markets
    sources: [osm]
    industry: "Accounting & Tax"
    max_results: 50
    tags: [developed-markets]

  - name: real-estate-developed
    keywords: ["real estate"]             # estate agents, property management
    locations: *english_markets
    sources: [osm]
    industry: "Real Estate"
    max_results: 50
    tags: [developed-markets]

  - name: architects-developed
    keywords: ["architect"]               # architects, engineers, surveyors
    locations: *english_markets
    sources: [osm]
    industry: "Architecture & Engineering"
    max_results: 50
    tags: [developed-markets]

  - name: construction-trades-developed
    keywords: ["plumber"]                 # plumbers, electricians, roofers, builders, HVAC …
    locations: *english_markets
    sources: [osm]
    industry: "Construction & Trades"
    max_results: 50
    tags: [developed-markets]

  - name: hotels-developed
    keywords: ["hotel"]                   # hotels, guest houses, hostels, travel agents
    locations: *english_markets
    sources: [osm]
    industry: "Hospitality & Travel"
    max_results: 50
    tags: [developed-markets]

  - name: fitness-developed
    keywords: ["gym"]                     # fitness centres, sports centres, massage
    locations: *english_markets
    sources: [osm]
    industry: "Fitness & Wellness"
    max_results: 50
    tags: [developed-markets]

  - name: beauty-salons-developed
    keywords: ["hair salon"]              # hairdressers, beauty salons
    locations: *english_markets
    sources: [osm]
    industry: "Beauty & Personal Care"
    max_results: 50
    tags: [developed-markets]

  - name: it-companies-developed
    keywords: ["it company"]              # office=it: potential partners / white-label work
    locations: *english_markets
    sources: [osm]
    industry: "IT & Software"
    max_results: 50
    tags: [developed-markets, partners]

schedules:
  - search: dental-uk
    cron: "0 6 * * MON"      # every Monday 06:00 (timezone above)
  # Add more the same way, e.g. one industry search per week day:
  # - search: law-firms-developed
  #   cron: "0 6 * * TUE"
